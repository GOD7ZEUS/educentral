# Render has no managed MySQL offering (only Postgres/Redis), so unlike the
# earlier Postgres setup there's no `databases:` block here — DATABASE_URL
# points at an external MySQL host you provide (Railway, Aiven, PlanetScale,
# a self-hosted instance, etc.) via the sync: false env var below.

services:
  - type: web
    name: educentral
    runtime: node
    plan: free
    region: oregon
    buildCommand: >
      cd frontend && npm install --include=dev && npm run build &&
      cd ../backend && npm install --include=dev && npx prisma generate && npm run build
    startCommand: >
      cd backend &&
      npx prisma db push --skip-generate &&
      npx tsx prisma/seed.ts &&
      npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
