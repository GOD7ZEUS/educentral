databases:
  - name: educentral-db
    plan: free
    databaseName: educentral
    user: educentral

services:
  - type: web
    name: educentral
    runtime: node
    plan: free
    region: oregon
    buildCommand: >
      cd frontend && npm install && npm run build &&
      cd ../backend && npm install && npx prisma generate && npm run build
    startCommand: >
      cd backend &&
      npx prisma db push --skip-generate &&
      npx tsx prisma/seed.ts &&
      npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: educentral-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
