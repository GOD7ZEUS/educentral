<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduCentral</title>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash">
      <svg viewBox="0 0 100 100" id="splash-logo" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="splashFire" gradientUnits="userSpaceOnUse" cx="50" cy="58" r="58">
            <stop offset="0%" stop-color="#fde047" />
            <stop offset="40%" stop-color="#fb923c" />
            <stop offset="100%" stop-color="#b91c1c" />
          </radialGradient>
        </defs>
        <path d="M55 47 Q74.2 59.3 97 58 Q77.8 45.7 55 47 Z" fill="url(#splashFire)" />
        <path d="M55 47 Q77.8 51.4 99 42 Q76.2 37.6 55 47 Z" fill="url(#splashFire)" />
        <path d="M55 47 Q77.9 42.1 94 25 Q71.1 29.9 55 47 Z" fill="url(#splashFire)" />
        <path d="M55 47 Q75.6 31.6 84 10 Q64.4 26.4 55 47 Z" fill="url(#splashFire)" />
        <path d="M55 47 Q70.3 25.1 72 6 Q57.7 21.9 55 47 Z" fill="url(#splashFire)" />
        <path d="M45 47 Q25.8 59.3 3 58 Q22.2 45.7 45 47 Z" fill="url(#splashFire)" />
        <path d="M45 47 Q22.2 51.4 1 42 Q23.8 37.6 45 47 Z" fill="url(#splashFire)" />
        <path d="M45 47 Q22.1 42.1 6 25 Q28.9 29.9 45 47 Z" fill="url(#splashFire)" />
        <path d="M45 47 Q24.4 31.6 16 10 Q35.6 26.4 45 47 Z" fill="url(#splashFire)" />
        <path d="M45 47 Q29.7 25.1 28 6 Q42.3 21.9 45 47 Z" fill="url(#splashFire)" />
        <path d="M50 26 C 45 32 42 39 44 48 C 47 43 49 39 50 36 C 51 39 53 43 56 48 C 58 39 55 32 50 26 Z" fill="url(#splashFire)" />
        <path d="M50 7 C 41 10 36 19 41 29 C 44 25 47 21 50 18 C 53 21 56 25 59 29 C 64 19 59 10 50 7 Z" fill="url(#splashFire)" />
        <path d="M47 27 Q50 34 53 27 Q50 30 47 27 Z" fill="url(#splashFire)" />
        <path d="M44 58 C 36 70 32 84 37 97 C 43 86 46 74 48 60 Z" fill="url(#splashFire)" />
        <path d="M50 60 C 49 74 50 88 50 98 C 52 88 53 74 52 60 Z" fill="url(#splashFire)" />
        <path d="M56 58 C 64 70 68 84 63 97 C 57 86 54 74 52 60 Z" fill="url(#splashFire)" />
      </svg>
      <div id="splash-title">EduCentral</div>
      <div id="splash-track"><div id="splash-bar"></div></div>
      <div id="splash-pct">0%</div>
    </div>

    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        transition: opacity 0.35s ease;
      }
      #splash-logo {
        width: 64px;
        height: 64px;
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      #splash-title {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #1e293b;
        letter-spacing: 0.02em;
      }
      #splash-track {
        width: 220px;
        height: 6px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      #splash-bar {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #6366f1, #4f46e5);
        transition: width 0.2s ease-out;
      }
      #splash-pct {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
    </style>

    <script>
      (function () {
        var bar = document.getElementById("splash-bar");
        var pct = document.getElementById("splash-pct");
        var splash = document.getElementById("splash");
        var progress = 0;
        var hidden = false;

        var ticker = setInterval(function () {
          // Ease toward 90% while the app boots; the real jump to 100% only
          // happens once hideSplash() is actually called.
          progress += (90 - progress) * 0.1 + 0.3;
          if (progress > 90) progress = 90;
          render();
        }, 80);

        function render() {
          bar.style.width = progress + "%";
          pct.textContent = Math.round(progress) + "%";
        }

        window.hideSplash = function () {
          if (hidden) return;
          hidden = true;
          clearInterval(ticker);
          progress = 100;
          render();
          setTimeout(function () {
            splash.style.opacity = "0";
            setTimeout(function () {
              splash.remove();
            }, 350);
          }, 150);
        };

        // Safety net: never leave the splash stuck up if something upstream
        // (an error before React mounts, a slow network) never calls hideSplash.
        setTimeout(function () {
          window.hideSplash();
        }, 8000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
