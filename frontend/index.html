<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/phoenix-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduCentral</title>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash">
      <img src="/phoenix-logo.jpg" id="splash-logo" alt="EduCentral" />
      <div id="splash-title">EduCentral</div>
      <div id="splash-track"><div id="splash-bar"></div></div>
      <div id="splash-pct">0%</div>
    </div>

    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        transition: opacity 0.35s ease;
      }
      #splash-logo {
        width: 96px;
        height: 64px;
        object-fit: contain;
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      #splash-title {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #1e293b;
        letter-spacing: 0.02em;
      }
      #splash-track {
        width: 220px;
        height: 6px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      #splash-bar {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #6366f1, #4f46e5);
        transition: width 0.2s ease-out;
      }
      #splash-pct {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
    </style>

    <script>
      (function () {
        var bar = document.getElementById("splash-bar");
        var pct = document.getElementById("splash-pct");
        var splash = document.getElementById("splash");
        var progress = 0;
        var hidden = false;

        var ticker = setInterval(function () {
          // Ease toward 90% while the app boots; the real jump to 100% only
          // happens once hideSplash() is actually called.
          progress += (90 - progress) * 0.1 + 0.3;
          if (progress > 90) progress = 90;
          render();
        }, 80);

        function render() {
          bar.style.width = progress + "%";
          pct.textContent = Math.round(progress) + "%";
        }

        window.hideSplash = function () {
          if (hidden) return;
          hidden = true;
          clearInterval(ticker);
          progress = 100;
          render();
          setTimeout(function () {
            splash.style.opacity = "0";
            setTimeout(function () {
              splash.remove();
            }, 350);
          }, 150);
        };

        // Safety net: never leave the splash stuck up if something upstream
        // (an error before React mounts, a slow network) never calls hideSplash.
        setTimeout(function () {
          window.hideSplash();
        }, 8000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
